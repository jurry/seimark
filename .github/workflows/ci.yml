name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: build
        run: make build

      - name: vet
        run: make vet

      - name: fmt-check
        run: make fmt-check

      - name: test
        run: make test

      - name: race
        run: go test -race ./...
        env:
          CGO_ENABLED: "1"

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.3
          args: --timeout=5m

  browser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: browser
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: install
        run: npm ci

      - name: typecheck
        run: npm run typecheck

      - name: test
        run: npm test

      - name: build
        run: npm run build

      - name: install browsers
        run: npx playwright install --with-deps chromium

      # Chromium only. Firefox needs the OpenH264 GMP, which it downloads at
      # runtime and the Playwright build does not ship, so it negotiates H.264
      # and then encodes nothing. The firefox project stays in
      # playwright.config.ts and e2e/loopback.spec.ts fails there rather than
      # skipping, because a skip would hide that the standard-API path is
      # unverified on the one browser with no fallback.
      - name: e2e
        run: npm run e2e -- --project=chromium
