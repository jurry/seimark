name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: build
        run: make build

      - name: vet
        run: make vet

      - name: fmt-check
        run: make fmt-check

      - name: test
        run: make test

      - name: race
        run: go test -race ./...
        env:
          CGO_ENABLED: "1"

      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.11.3
          args: --timeout=5m
